{{define "content"}}
<h2>Channel</h2>
{{if .Bound}}
<section class="card">
  <h3>Current binding</h3>
  <dl>
    <dt>Title</dt><dd>{{.Channel.Title}}</dd>
    <dt>ID</dt><dd><code>{{.Channel.ID}}</code></dd>
  </dl>
</section>
{{else}}
<p><em>No channel bound to this profile yet.</em></p>
{{end}}

<p>
  {{if and .HasAPI .HasAuth}}
  <a href="/channel/list" class="btn">List my channels</a>
  {{end}}
  <a href="/channel/set" class="btn">Set channel manually</a>
</p>
{{end}}
