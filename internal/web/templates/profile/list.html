{{define "content"}}
<h2>Profiles</h2>
<div class="row">
  <a href="/profiles/new" class="btn">Create</a>
  <a href="/profiles/import" class="btn secondary">Import bundle</a>
</div>
{{if .Profiles}}
<table>
<thead><tr><th>Name</th><th>Status</th><th class="actions"></th></tr></thead>
<tbody>
{{range .Profiles}}
<tr>
  <td><a href="/profiles/{{.}}"><strong>{{.}}</strong></a></td>
  <td>{{if eq . $.Default}}<span class="pill muted" title="telfs commands without TELFS_PROFILE use it">CLI default</span>{{end}}</td>
  <td class="actions">
    <form method="post" action="/profiles/{{.}}/export" style="display:inline">
      <input type="hidden" name="csrf" value="{{$.CSRF}}">
      <button type="submit" class="secondary">Export</button>
    </form>
    <form method="post" action="/profiles/{{.}}/delete" style="display:inline" onsubmit="return confirm('Delete profile {{.}}? Local data only — channel data is untouched.');">
      <input type="hidden" name="csrf" value="{{$.CSRF}}">
      <button type="submit" class="danger">Delete</button>
    </form>
  </td>
</tr>
{{end}}
</tbody>
</table>
{{else}}
<p><em>No profiles yet.</em></p>
{{end}}
{{end}}
